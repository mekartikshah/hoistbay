name: Build Desktop Releases

# PRs build and test every change before it merges, and a v* tag builds the
# release, so pushes to main don't build again. Run it by hand for an ad-hoc
# build of any branch.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A new push to a PR cancels that PR's older run; release runs never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS release
        run: |
          # Fixed asset name so the website can link to
          # /releases/latest/download/Hoistbay-macOS.zip
          OUTPUT_NAME="Hoistbay-macOS"
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          # Rename the bundle to a plain "Hoistbay.app" for users, and use ditto so
          # framework symlinks inside the bundle are preserved.
          cp -R "${APP_PATH}" "Hoistbay.app"
          ditto -c -k --sequesterRsrc --keepParent "Hoistbay.app" "${OUTPUT_NAME}.zip"
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.zip

      # The release description is the CHANGELOG section for this version, so
      # a tag without that section fails instead of publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${VERSION}]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_NAME }}.zip
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      # Exercises profile storage against the real DPAPI store and preferences
      # file, which the unit tests only mock.
      - name: Run Windows integration tests
        run: flutter test integration_test -d windows

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        run: |
          # Fixed asset name so the website can link to
          # /releases/latest/download/Hoistbay-Windows.zip
          $outputName = "Hoistbay-Windows"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${outputName}.zip"
          echo "OUTPUT_NAME=${outputName}" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.zip

      # The release description is the CHANGELOG section for this version, so
      # a tag without that section fails instead of publishing an empty release.
      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [${VERSION}]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_NAME }}.zip
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
