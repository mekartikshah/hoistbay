name: Build Desktop Releases

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS release
        run: |
          # Fixed asset name so the website can link to
          # /releases/latest/download/S3-Scout-macOS.zip
          OUTPUT_NAME="S3-Scout-macOS"
          APP_PATH=$(ls -d build/macos/Build/Products/Release/*.app | head -n 1)
          # Rename the bundle to a plain "S3 Scout.app" for users, and use ditto so
          # framework symlinks inside the bundle are preserved.
          cp -R "${APP_PATH}" "S3 Scout.app"
          ditto -c -k --sequesterRsrc --keepParent "S3 Scout.app" "${OUTPUT_NAME}.zip"
          echo "OUTPUT_NAME=${OUTPUT_NAME}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows release
        run: |
          # Fixed asset name so the website can link to
          # /releases/latest/download/S3-Scout-Windows.zip
          $outputName = "S3-Scout-Windows"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${outputName}.zip"
          echo "OUTPUT_NAME=${outputName}" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUTPUT_NAME }}
          path: ${{ env.OUTPUT_NAME }}.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_NAME }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
